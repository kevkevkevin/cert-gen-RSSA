<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
    padding: 30px;
    text-align: center;
  }

  h1 {
    margin-bottom: 10px;
  }

  .template-list {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
  }

  .template {
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.2s;
  }

  .template.selected {
    border: 2px solid #007bff;
    box-shadow: 0 0 8px #007bff;
  }

  .template img {
    width: 450px;
    height: auto;
    border-radius: 8px;
  }

  #nameInput {
    padding: 8px 12px;
    width: 250px;
    border-radius: 4px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
  }

  button {
    background: #007bff;
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
  }

  button:hover {
    background: #0056b3;
  }

  canvas {
    display: none;
  }

  .output img {
    width: 300px;
    margin: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  /* Floating counter */
  #selectionCounter {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-weight: 600;
    z-index: 999;
  }

  #clearAllBtn {
    background: #ff6272;
    margin-top: 10px;
    width: 100%;
  }

  #clearAllBtn:hover {
    background: #92212d;
  }
</style>
</head>
<body>

<h1>🎓 Certificate Generator</h1>
<p>Select templates and enter your name below:</p>

<div id="selectionCounter">
  Selected: <span id="selectedCount">0</span>
  <button id="clearAllBtn">🚮 Clear All</button>
</div>

<div id="day1" class="template-list">
  <!-- (your certificate templates remain unchanged) -->
  <div class="template" data-template="1.png">
      <img src="certs/1.png">
      <p style="font-size: 9px !important">Attendance</p>
  </div>
  
    <div class="template" data-template="speaker.png">
        <img src="certs/speaker.png">
        <p style="font-size: 9px !important">Speaker</p>
    </div>
  <!-- more templates ... -->
</div>

<input type="text" id="nameInput" placeholder="Enter your name"><br>

<button id="generateBtn">Generate Certificates</button>
<button id="downloadAllBtn" style="display:none;">Download All</button>

<div class="output" id="output"></div>
<canvas id="canvas"></canvas>

<script>
const generateBtn = document.getElementById('generateBtn');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const nameInput = document.getElementById('nameInput');
const output = document.getElementById('output');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const selectedCountEl = document.getElementById('selectedCount');
const clearAllBtn = document.getElementById('clearAllBtn');
let generatedImages = [];

// Template selection toggle and counter update
document.addEventListener('click', e => {
  if (e.target.closest('.template')) {
    const template = e.target.closest('.template');
    template.classList.toggle('selected');
    updateCounter();
  }
});

function updateCounter() {
  const selectedCount = document.querySelectorAll('.template.selected').length;
  selectedCountEl.textContent = selectedCount;
}

// Generate certificates
generateBtn.addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if (!name) return alert('Please enter your name');

  const selectedTemplates = [...document.querySelectorAll('.template.selected')];
  if (selectedTemplates.length === 0) return alert('Select at least one certificate');

  output.innerHTML = ''; 
  generatedImages = [];

  for (const t of selectedTemplates) {
    const imgPath = 'certs/' + t.dataset.template;
    const img = await loadImage(imgPath);

    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.font = `700 80px Poppins`;

    if (t.dataset.template === 'attendance.png') {
      ctx.fillText(name, canvas.width / 2.25, canvas.height - 970);
    } else {
      ctx.fillText(name, canvas.width / 2.25, canvas.height - 1030);
    }

    const dataURL = canvas.toDataURL('image/png');
    generatedImages.push({ dataURL, fileName: `${name}_${t.dataset.template}` });

    const imgEl = document.createElement('img');
    imgEl.src = dataURL;
    output.appendChild(imgEl);
  }

  if (generatedImages.length > 0) {
    downloadAllBtn.style.display = 'inline-block';
  }
});

// Download all generated certificates
downloadAllBtn.addEventListener('click', () => {
  generatedImages.forEach(imgObj => {
    const link = document.createElement('a');
    link.href = imgObj.dataURL;
    link.download = imgObj.fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
});

// Clear all (reset selections, input, output)
clearAllBtn.addEventListener('click', () => {
  document.querySelectorAll('.template.selected').forEach(el => el.classList.remove('selected'));
  nameInput.value = '';
  output.innerHTML = '';
  generatedImages = [];
  downloadAllBtn.style.display = 'none';
  updateCounter();
});

// Helper: Load image
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
</script>

</body>
</html>
